
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北玄宫 BEI XUAN GONG</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100e0c;color:#f4dfad;font-family:Georgia,"Noto Serif SC",serif;overflow:hidden}
#intro{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse,#49351d,#100d09 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#intro h1{font-size:38px;letter-spacing:9px;margin:0 0 12px}
#intro p{letter-spacing:4px;color:#d2b77d}
button{background:linear-gradient(135deg,#d9bb78,#8d642c);border:1px solid #f4dda5;color:#24190c;padding:14px 35px;font-size:16px;letter-spacing:3px;cursor:pointer;margin-top:28px}
#hud{position:fixed;top:15px;left:15px;z-index:2;color:#e8d3a2;text-shadow:0 1px 5px #000;pointer-events:none}
#hint{position:fixed;bottom:15px;left:0;right:0;text-align:center;color:#d9c394;font-size:12px;z-index:2;pointer-events:none}
#enter{position:fixed;top:15px;right:15px;z-index:3;background:#392817;color:#f3d99d;border:1px solid #b99352;padding:9px 14px;margin:0;font-size:12px}
</style>
</head>
<body>
<div id="intro">
  <h1>北玄宫</h1>
  <p>BEI XUAN GONG</p>
  <p>虚拟文化殿堂 · 主殿</p>
  <button id="start">进入虚拟主殿</button>
</div>
<div id="hud">北玄宫 · 主殿</div>
<button id="enter" onclick="location.reload()">返回入口</button>
<div id="hint">拖动旋转视角 · 滚轮缩放 · 探索主殿</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x100d0a);
scene.fog=new THREE.Fog(0x100d0a,24,48);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
camera.position.set(0,6,15);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,0);
controls.enableDamping=true;
controls.minDistance=5;
controls.maxDistance=23;
controls.maxPolarAngle=Math.PI*.82;

scene.add(new THREE.HemisphereLight(0xffe8c2,0x21170e,1.5));
const ambient=new THREE.AmbientLight(0xffd9a0,.45);
scene.add(ambient);

function light(x,y,z,intensity,color=0xffd28a,distance=20){
 const l=new THREE.PointLight(color,intensity,distance);
 l.position.set(x,y,z);scene.add(l);
}
light(0,9,0,180);
light(-7,7,0,90);light(7,7,0,90);
light(0,6,7,100);light(0,5,-7,100);

function mat(color,rough=.5,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
const wood=mat(0x302017,.42);
const darkWood=mat(0x1b120d,.38);
const gold=mat(0xc49a4b,.28,.72);
const stone=mat(0x282626,.22,.25);
const black=mat(0x090909,.3,.3);
const cream=mat(0x9d8765,.55);

function box(w,h,d,m,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function cylinder(rt,rb,h,m,x,y,z,segments=32){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function torus(r,t,m,x,y,z){
 const o=new THREE.Mesh(new THREE.TorusGeometry(r,t,12,100),m);
 o.rotation.x=Math.PI/2;o.position.set(x,y,z);scene.add(o);return o;
}

// Floor: polished dark stone with gold inlay
box(22,.5,24,stone,0,-.3,0);
for(let x=-9;x<=9;x+=3){
 box(.025,.012,22,gold,x,-.035,0);
}
for(let z=-10;z<=10;z+=3){
 box(20,.012,.025,gold,0,-.03,z);
}

// Walls and raised architectural panels
box(22,10,.5,darkWood,0,5,-11);
box(.5,10,22,darkWood,-11,5,0);
box(.5,10,22,darkWood,11,5,0);
for(let x=-9;x<=9;x+=3){
 box(2.5,7,.12,wood,x,4.5,-10.72);
 box(2.3,.07,.08,gold,x,8,-10.62);
 box(2.3,.07,.08,gold,x,1,-10.62);
}
for(let side of [-1,1]){
 for(let z=-8;z<=8;z+=3){
  box(.12,7,2.5,wood,side*10.72,4.5,z);
  for(let i=0;i<5;i++){
   box(.07,6,.035,gold,side*10.62,4.5,z-1+i*.5);
  }
 }
}

// Ceiling beams and layered dark ceiling
box(22,.45,24,darkWood,0,10.2,0);
for(let x=-10;x<=10;x+=2){
 box(.16,.32,23,gold,x,9.92,0);
}
for(let z=-10;z<=10;z+=2){
 box(21,.22,.14,wood,0,9.8,z);
}
box(15,.25,17,wood,0,9.55,0);

// Pillars: six substantial columns with gold capitals and bases
for(let x of [-8,0,8]){
 for(let z of [-7,7]){
  cylinder(.48,.58,8.4,wood,x,4.2,z);
  cylinder(.65,.65,.32,gold,x,.25,z);
  cylinder(.64,.64,.22,darkWood,x,.52,z);
  cylinder(.65,.65,.28,gold,x,8.45,z);
  cylinder(.53,.53,.2,darkWood,x,8.68,z);
  torus(.49,.07,gold,x,1,z);
  torus(.49,.07,gold,x,7.5,z);
 }
}

// Central ceiling medallion
cylinder(3.25,3.25,.2,darkWood,0,9.36,0,96);
cylinder(2.95,2.95,.08,gold,0,9.22,0,96);
cylinder(2.72,2.72,.1,black,0,9.14,0,96);
torus(3.08,.09,gold,0,9.08,0);
torus(2.5,.035,gold,0,9.03,0);

// Bagua yin-yang center
cylinder(1.05,1.05,.12,gold,0,9.0,0,64);
cylinder(.92,.92,.1,black,0,8.91,0,64);
const yin=new THREE.Mesh(new THREE.SphereGeometry(.44,32,20),mat(0xe4d5b5,.35));
yin.scale.set(1,.12,1);yin.position.set(0,8.83,0);scene.add(yin);
const yang=new THREE.Mesh(new THREE.SphereGeometry(.44,32,20),black);
yang.scale.set(1,.12,1);yang.position.set(0,8.84,0);yang.position.x=.28;scene.add(yang);
cylinder(.12,.12,.05,black,0,8.78,-.34,24);
cylinder(.12,.12,.05,cream,0,8.78,.34,24);

// Eight trigrams: three broken/solid lines around the center
for(let i=0;i<8;i++){
 const a=i*Math.PI/4;
 const group=new THREE.Group();
 for(let j=0;j<3;j++){
  const r=j*.19;
  if((i+j)%2===0){
   const bar=box(.52,.045,.09,gold,0,0,0);
   bar.position.set(0,0,0);
   group.add(bar);
  }else{
   group.add(new THREE.Mesh(new THREE.BoxGeometry(.22,.045,.09),gold));
   const b=new THREE.Mesh(new THREE.BoxGeometry(.22,.045,.09),gold);
   b.position.x=.29;group.add(b);
  }
 }
 group.position.set(Math.sin(a)*1.85,8.88,Math.cos(a)*1.85);
 group.rotation.y=a;
 scene.add(group);
}

// Dragon and phoenix ceiling ornaments, stylised raised golden curves
function creatureCurve(points,radius=0.11){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,100,radius,10,false),gold);
 mesh.castShadow=true;scene.add(mesh);
}
const dragon=[];
for(let i=0;i<=24;i++){
 const t=i/24*Math.PI*2;
 dragon.push([Math.cos(t)*4.2,9.0,Math.sin(t)*1.35-1.5]);
}
creatureCurve(dragon,.14);
const phoenix=[];
for(let i=0;i<=24;i++){
 const t=i/24*Math.PI*2;
 phoenix.push([Math.cos(t)*4.2,9.0,Math.sin(t)*1.35+1.5]);
}
creatureCurve(phoenix,.14);
for(let side of [-1,1]){
 const pts=[];
 for(let i=0;i<=20;i++){
  const t=i/20*Math.PI*1.8;
  pts.push([side*(3.1+Math.cos(t)*1.3),9.0,Math.sin(t)*1.0]);
 }
 creatureCurve(pts,.09);
}

// Main altar platform and three shrines
box(13,.65,2.7,darkWood,0,.35,-7.5);
box(13,.12,2.75,gold,0,.72,-7.5);
const positions=[-4.2,0,4.2];
positions.forEach((x,i)=>{
 box(3.3,.35,1.8,wood,x,1,-7.5);
 box(2.9,.12,1.5,gold,x,1.24,-7.5);
 box(2.55,2.2,.28,darkWood,x,2.4,-8.15);
 box(2.35,.09,.08,gold,x,3.45,-7.98);
 box(.08,2,.08,gold,x-1.15,2.4,-7.96);
 box(.08,2,.08,gold,x+1.15,2.4,-7.96);
 cylinder(.45,.5,.65,gold,x,1.75,-6.5);
 cylinder(.34,.34,.12,black,x,2.14,-6.5);
});

// Ceiling ring lighting
for(let r of [3.45,4.8]){
 const ring=torus(r,.035,gold,0,9.0,0);
}
for(let i=0;i<24;i++){
 const a=i*Math.PI*2/24;
 const l=new THREE.PointLight(0xffd58c,3,4);
 l.position.set(Math.cos(a)*4.7,9.1,Math.sin(a)*4.7);
 scene.add(l);
}

// Hanging lanterns
for(let x of [-7,7]){
 for(let z of [-3,3]){
  cylinder(.35,.35,.12,gold,x,8.9,z);
  const lantern=new THREE.Mesh(new THREE.CylinderGeometry(.22,.32,.65,8),mat(0xc28b3b,.3,.25));
  lantern.position.set(x,8.45,z);scene.add(lantern);
  cylinder(.35,.35,.08,gold,x,8.08,z);
  light(x,8.2,z,18,0xffc66b,7);
 }
}

// Decorative front lighting
light(0,4,-5,80,0xffd38a,14);
light(-4,3,-5,35);light(4,3,-5,35);

document.getElementById("start").addEventListener("click",()=>{
 document.getElementById("intro").style.display="none";
 camera.position.set(0,6,15);
 controls.target.set(0,4,0);
});

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
